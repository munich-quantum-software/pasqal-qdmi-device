version: 2

sphinx:
  configuration: docs/conf.py

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"
  apt_packages:
    - libssl-dev
    - zlib1g-dev
  jobs:
    post_checkout:
      # Private credentials are unavailable to PR builds; GitHub CI executes the docs.
      - if [ "$READTHEDOCS_VERSION_TYPE" = "external" ]; then exit 183; fi
    pre_build:
      - python -m pip install uv
    build:
      html:
        - uvx nox --non-interactive -s docs
        - mkdir -p "$READTHEDOCS_OUTPUT/html" && cp -R docs/_build/html/. "$READTHEDOCS_OUTPUT/html"
