version: 2
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
build:
  os: ubuntu-26.04
  tools:
    python: "3.12"
  jobs:
    post_create_environment:
      - pip install uv
    post_install:
      - uv sync --locked --only-group docs
    build:
      html:
        - uv run --locked --only-group docs sphinx-build -n -W --keep-going -b html docs "$READTHEDOCS_OUTPUT/html"
