version: 2

formats:
  - htmlzip

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

build:
  os: ubuntu-26.04
  apt_packages:
    - doxygen
    - libssl-dev
    - zlib1g-dev
  tools:
    python: "3.14"
  jobs:
    install:
      - >-
        uv sync --locked --no-dev --group docs
        --config-settings-package pasqal-qdmi:wheel.cmake=false
    pre_build:
      - >-
        cmake -S . -B build/docs
        -DBUILD_PASQAL_QDMI_TESTS=OFF -DBUILD_PASQAL_QDMI_DOCS=ON
      - cmake --build build/docs --target pasqal-qdmi-device-docs

python:
  install:
    - method: uv
      command: sync
