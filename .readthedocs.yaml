version: 2

sphinx:
  configuration: docs/conf.py

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"
  apt_packages:
    - libssl-dev
    - zlib1g-dev
  jobs:
    pre_build:
      - python -m pip install uv
    build:
      html:
        # Use the released Core wheel to fit the documentation build time limit.
        - >-
          uv run --no-sources-package mqt-core --no-dev --group docs
          sphinx-build -n -W --keep-going -b html -D nb_execution_mode=off
          docs "$READTHEDOCS_OUTPUT/html"
