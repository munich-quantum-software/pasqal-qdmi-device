version: 2

sphinx:
  configuration: docs/conf.py

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"
  apt_packages:
    - libssl-dev
  jobs:
    pre_build:
      - python -m pip install uv
    build:
      html:
        - uvx nox --non-interactive -s docs
        - mkdir -p "$READTHEDOCS_OUTPUT/html" && cp -R docs/_build/html/. "$READTHEDOCS_OUTPUT/html"
