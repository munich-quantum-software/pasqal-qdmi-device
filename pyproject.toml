[build-system]
build-backend = "scikit_build_core.build"
requires = [ "scikit-build-core>=1.1.1" ]


[project]
name = "pasqal-qdmi"
version = "1.0.0"
description = "Pasqal QDMI Device Implementation"
readme = "README.md"
license = "Apache-2.0 WITH LLVM-exception"
license-files = [ "LICENSE" ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Quantum Computing",
  "Typing :: Typed",
]
dynamic = [ "import-names", "import-namespaces" ]

[[project.authors]]
name = "Lukas Burgholzer"
email = "burgholzer@me.com"

[[project.authors]]
name = "Aleksander Wennersteen"
email = "aleksander.wennersteen@pasqal.com"

[project.optional-dependencies]
core = [ "mqt-core>=4.1.1" ]
pulser = [ "pulser>=1.9.1" ]

[project.urls]
Homepage = "https://github.com/munich-quantum-software/pasqal-qdmi-device"
Documentation = "https://pasqal-qdmi-device.readthedocs.io/en/stable/"
Issues = "https://github.com/munich-quantum-software/pasqal-qdmi-device/issues"

[project.entry-points]
"mqt.core.qdmi.manifests".pasqal = "pasqal.qdmi"


[dependency-groups]
dev = [
  { include-group = "build" },
  { include-group = "test" },
  "nox>=2026.10.20",
]
test = [
  "mqt-core>=4.1.1",
  "pulser>=1.9.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1",
  "pytest-sugar>=1.1.1",
  "pytest-xdist>=3.8",
]
docs = [
  "furo>=2025.12.19",
  "mqt-core>=4.1.1",
  "myst-nb>=1.4",
  "pulser>=1.9.1",
  "sphinx>=9.0.4",
  "sphinx-copybutton>=0.5.2",
]
build = [ "scikit-build-core>=1.1.1" ]


[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}/{build_type}"

[tool.scikit-build.build]
targets = [ "pasqal-qdmi-device" ]

[tool.scikit-build.cmake]
version = "CMakeLists.txt"

[tool.scikit-build.cmake.define]
BUILD_PASQAL_QDMI_TESTS = "OFF"

[tool.scikit-build.sdist]
include = [ "python/pasqal/qdmi/_version.py" ]
exclude = [
  "**/docs",
  "**/test",
  ".*",
]

[tool.scikit-build.wheel]
py-api = "py311"
packages = [ "python/pasqal" ]
install-dir = "pasqal/qdmi/data"

[tool.scikit-build.install]
components = [ "pasqal-qdmi-device_Runtime", "pasqal-qdmi-device_Development" ]

[[tool.scikit-build.generate]]
path = "pasqal/qdmi/_version.py"
template = '''
version = "${version}"
'''


[tool.uv]
required-version = ">=0.13.4"
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
  { file = "CMakeLists.txt" },
  { file = "cmake/**/*" },
  { file = "src/**/*" },
  { file = "include/**/*" },
]

[tool.uv.sources]
pasqal-qdmi = { workspace = true }


[tool.cibuildwheel]
build = "cp3*"
skip = [ "*-musllinux_*", "cp3??t-*", "*-win_arm64" ]
archs = "auto64"
build-frontend = "uv"
environment-pass = [ "PASQAL_EMAIL", "PASQAL_PASSWORD", "PASQAL_PROJECT_ID" ]
test-command = "pytest test/python"
test-groups = [ "test" ]
test-sources = [ "test/python", "pyproject.toml" ]

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "13.3" }

[tool.cibuildwheel.windows]
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel} --namespace-pkg pasqal"

[[tool.cibuildwheel.overrides]]
select = "*-manylinux*"
# EPEL installs OpenSSL 3 alongside the distribution's older default version.
environment = { CMAKE_INCLUDE_PATH = "/usr/include/openssl3", CMAKE_LIBRARY_PATH = "/usr/lib64/openssl3" }
before-all = "yum install -y openssl3-devel zlib-devel"


[tool.ruff]
line-length = 120
namespace-packages = [ "pasqal" ]
src = [ "python" ]
preview = true
fix = true
unsafe-fixes = true
show-fixes = true

[tool.ruff.lint.per-file-ignores]
"docs/**" = [ "INP001", "T20" ]
"docs/conf.py" = [ "A001" ]
"test/python/**" = [ "INP001", "T20" ]

[tool.ruff.lint.isort]
known-first-party = [ "pasqal.qdmi" ]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
  "C90",     # <...> too complex
  "COM812",  # Conflicts with formatter
  "PLR09",   # Too many <...>
  "PLR2004", # Magic value used in comparison
  "S101",    # Use of assert detected
  "S404",    # `subprocess` module is possibly insecure
  "TID252"  # Prefer absolute imports over relative imports from parent modules
]
future-annotations = true


[tool.repo-review.ignore]
GH200 = "We use Renovate instead of Dependabot"
PC160 = "We use a mirror of crate-ci/typos"
PC170 = "We do not use rST files anymore"


[tool.pyproject-fmt]
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"
separate_root_table = "\n\n"


[tool.typos]

[tool.typos.default]
extend-ignore-re = [
  "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",                      # ignore line
  "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on", # ignore block
]


[tool.ty.src]
exclude = [
  "docs/**",
]

[tool.ty.terminal]
# Error if ty emits any warning-level diagnostics.
error-on-warning = true


[tool.pytest]
addopts = [ "-m", "not live", "-ra", "--numprocesses=auto" ]
filterwarnings = [ "error" ]
log_level = "INFO"
markers = [ "integration: submits bounded jobs to Pasqal EMU_FREE", "live: explicit provider access" ]
minversion = "9.1"
strict = true
testpaths = [ "test/python" ]
