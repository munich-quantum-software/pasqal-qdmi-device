[build-system]
requires = ["scikit-build-core>=1.1"]
build-backend = "scikit_build_core.build"

[project]
name = "pasqal-qdmi"
version = "0.2.0"
description = "Native Pulser execution on Pasqal through QDMI"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
authors = [{name = "Munich Quantum Software Company GmbH"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Quantum Computing",
  "Typing :: Typed",
]
dependencies = ["mqt-core>=4.1.1,<5"]

[project.optional-dependencies]
pulser = ["pulser-core==1.9.0"]
cloud = ["pulser-core==1.9.0", "pasqal-cloud==0.24.0"]

[project.urls]
Repository = "https://github.com/munich-quantum-software/pasqal-qdmi-device"
Issues = "https://github.com/munich-quantum-software/pasqal-qdmi-device/issues"

[project.entry-points."mqt.core.qdmi.manifests"]
pasqal = "pasqal.qdmi"

[dependency-groups]
build = ["build>=1.2.2", "scikit-build-core>=1.1"]
test = ["pytest>=8", "pulser-core==1.9.0", "pulser-simulation==1.9.0", "pasqal-cloud==0.24.0"]
docs = ["sphinx>=8,<10", "myst-parser>=4,<6", "furo>=2025.12.19", "sphinx-copybutton>=0.5.2"]
lint = ["ruff==0.17.0", "cmakelang==0.6.13", "pyyaml>=6", "check-jsonschema>=0.38", "prek>=0.3"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/wheel/{wheel_tag}/{build_type}"
build.targets = ["pasqal-qdmi-device"]
cmake.version = "CMakeLists.txt"
cmake.define.BUILD_PASQAL_QDMI_TESTS = "OFF"
cmake.define.INSTALL_PASQAL_QDMI_DEVICE = "ON"
cmake.define.CMAKE_INSTALL_LIBDIR = "lib"
wheel.py-api = "py311"
wheel.packages = ["python/pasqal"]
wheel.install-dir = "pasqal/qdmi/data"
install.components = ["pasqal-qdmi-device_Runtime", "pasqal-qdmi-device_Development"]
sdist.exclude = [".git", ".venv", ".nox", "build*", "dist", "docs/_build"]

[tool.cibuildwheel]
build = "cp311-*"
skip = ["*-musllinux_*", "*-win_arm64"]
archs = "auto64"
build-frontend = "uv"
test-command = "python -I -c \"import sys; from mqt.core.qdmi import builtin_driver; assert 'pasqal.emu-free' in builtin_driver.registered_device_ids(); assert 'pasqal.qdmi' not in sys.modules; assert builtin_driver.open_device('pasqal.emu-free', custom1='MOCK').qubits_num() > 0\""

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_34"
manylinux-aarch64-image = "manylinux_2_34"
before-all = "yum install -y openssl-devel"

[tool.cibuildwheel.macos]
environment = {MACOSX_DEPLOYMENT_TARGET = "13.3", CMAKE_ARGS = "-DCURL_INCLUDE_DIR=$(xcrun --show-sdk-path)/usr/include -DCURL_LIBRARY=$(xcrun --show-sdk-path)/usr/lib/libcurl.tbd"}
config-settings = {"cmake.define.CPR_USE_SYSTEM_CURL" = "ON", "cmake.define.CURL_NO_CURL_CMAKE" = "ON", "cmake.define.CMAKE_DISABLE_FIND_PACKAGE_PkgConfig" = "ON", "cmake.define.CURL_CONFIG_EXECUTABLE" = "/usr/bin/curl-config"}

[tool.cibuildwheel.windows]
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel} --namespace-pkg pasqal"

[tool.uv]
cache-keys = [{file = "pyproject.toml"}, {file = "CMakeLists.txt"}, {file = "cmake/**"}, {file = "src/**"}, {file = "include/**"}]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["python"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra"
markers = ["live: explicit bounded EMU_FREE execution (never routine CI)"]
