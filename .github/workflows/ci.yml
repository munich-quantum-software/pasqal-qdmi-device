name: CI
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  native:
    name: 🇨 Test
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-26.04, macos-26, windows-2025]
        config: [Release]
        sanitizers: [false]
        include:
          - runs-on: ubuntu-26.04
            config: Debug
            sanitizers: true
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Install NASM
        if: runner.os == 'Windows' && runner.arch == 'X64'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
      - name: Build and test native interfaces
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: uvx nox -s native -- --config ${{ matrix.config }} ${{ matrix.sanitizers && '--sanitizers' || '' }}
      - name: Relocated installed consumer
        if: ${{ !matrix.sanitizers }}
        run: cmake -P test/install.cmake

  lint:
    name: 🐍 Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
      - name: Run pre-commit checks
        run: uvx nox -s lint

  documentation:
    name: 📚 Documentation
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.id == github.event.pull_request.base.repo.id
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
      - name: Build documentation
        run: uvx nox -s docs
        env:
          PASQAL_EMAIL: ${{ secrets.PASQAL_EMAIL }}
          PASQAL_PASSWORD: ${{ secrets.PASQAL_PASSWORD }}
          PASQAL_PROJECT_ID: ${{ secrets.PASQAL_PROJECT_ID }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: docs/_build/html
          if-no-files-found: error

  build-sdist:
    name: 🐍 Packaging
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-sdist.yml@a4b4977405c7685f95e127cdb6db396bbadce787 # v2.5.5

  build-wheel:
    name: 🐍 Packaging
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, windows-2025]
    uses: $/.github/workflows/wheels.yml
    with:
      runs-on: ${{ matrix.runs-on }}
    secrets:
      PASQAL_EMAIL: ${{ secrets.PASQAL_EMAIL }}
      PASQAL_PASSWORD: ${{ secrets.PASQAL_PASSWORD }}
      PASQAL_PROJECT_ID: ${{ secrets.PASQAL_PROJECT_ID }}

  # This job provides the required branch protection check.
  required-checks-pass:
    name: Required checks
    if: always()
    needs: [native, lint, documentation, build-sdist, build-wheel]
    runs-on: ubuntu-slim
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.id != github.event.pull_request.base.repo.id && 'documentation' || '' }}
          jobs: ${{ toJSON(needs) }}
