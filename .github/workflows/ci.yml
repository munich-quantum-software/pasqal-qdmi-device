name: CI
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  change-detection:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-change-detection.yml@a4b4977405c7685f95e127cdb6db396bbadce787
    name: 🔍 Change
    with:
      additional-cpp-files: |
        CMakePresets.json
        .github/workflows/**
      additional-python-files: |
        .github/workflows/**
        test/fixtures/**
      additional-cd-files: |
        .github/workflows/**
        CMakeLists.txt
        cmake/**
        python/**
        src/**
        include/**
        pyproject.toml
        uv.lock
        LICENSE
        README.md

  cpp-tests-ubuntu:
    name: 🇨 Test 🐧
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-26.04
          - ubuntu-26.04-arm
        preset:
          - release
        include:
          - runs-on: ubuntu-26.04
            preset: debug
    with:
      runs-on: ${{ matrix.runs-on }}
      preset-name: ${{ matrix.preset }}
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-ubuntu.yml@a4b4977405c7685f95e127cdb6db396bbadce787

  cpp-tests-macos:
    name: 🇨 Test 🍎
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - macos-26
        preset:
          - release
        include:
          - runs-on: macos-26
            preset: debug
    with:
      runs-on: ${{ matrix.runs-on }}
      preset-name: ${{ matrix.preset }}
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-macos.yml@a4b4977405c7685f95e127cdb6db396bbadce787

  cpp-tests-windows:
    name: 🇨 Test 🏁
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - windows-2025
        preset:
          - release
    with:
      runs-on: ${{ matrix.runs-on }}
      preset-name: ${{ matrix.preset }}
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-windows.yml@a4b4977405c7685f95e127cdb6db396bbadce787

  cpp-sanitizers:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-ubuntu.yml@a4b4977405c7685f95e127cdb6db396bbadce787
    name: 🇨 Sanitizers
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    with:
      runs-on: ubuntu-26.04
      preset-name: sanitizers

  python-tests:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-tests.yml@a4b4977405c7685f95e127cdb6db396bbadce787
    name: 🐍 Test
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests)
    with:
      runs-on: ubuntu-26.04
      sessions: '["tests", "minimums"]'
      draft-sessions: '["tests-3.14", "minimums-3.14"]'

  python-coverage:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-coverage.yml@a4b4977405c7685f95e127cdb6db396bbadce787
    name: 🐍 Coverage
    needs: python-tests
    permissions:
      contents: read
      id-token: write

  python-linter:
    name: 🐍 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-linter)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-linter.yml@a4b4977405c7685f95e127cdb6db396bbadce787
    with:
      enable-ty: true
      enable-mypy: false

  live-tests:
    name: ☁️ Live tests
    needs:
      - change-detection
      - cpp-tests-ubuntu
      - cpp-tests-macos
      - cpp-tests-windows
      - python-tests
      - build-wheel
    if: >-
      always() && !cancelled()
      && !contains(needs.*.result, 'failure')
      && (
        github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository
      )
      && (
        needs.change-detection.outputs.run-cpp-tests == 'true'
        || needs.change-detection.outputs.run-python-tests == 'true'
        || needs.change-detection.outputs.run-cd == 'true'
      )
    uses: $/.github/workflows/reusable-live-tests.yml
    secrets:
      PASQAL_EMAIL: ${{ secrets.PASQAL_EMAIL }}
      PASQAL_PASSWORD: ${{ secrets.PASQAL_PASSWORD }}
      PASQAL_PROJECT_ID: ${{ secrets.PASQAL_PROJECT_ID }}

  cpp-install-tests:
    name: 📦 Native installation
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-26.04
          - macos-26
          - windows-2025
    uses: $/.github/workflows/cpp-install-tests.yml
    with:
      runs-on: ${{ matrix.runs-on }}

  build-sdist:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-sdist.yml@a4b4977405c7685f95e127cdb6db396bbadce787
    name: 🚀 CD
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests) || fromJSON(needs.change-detection.outputs.run-cd)

  build-wheel:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-wheel-cibuildwheel.yml@a4b4977405c7685f95e127cdb6db396bbadce787
    name: 🚀 CD
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests) || fromJSON(needs.change-detection.outputs.run-cd)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26
          - windows-2025
    with:
      runs-on: ${{ matrix.runs-on }}

  required-checks-pass:
    name: 🚦 Check
    if: always()
    needs:
      - change-detection
      - cpp-tests-ubuntu
      - cpp-tests-macos
      - cpp-tests-windows
      - cpp-sanitizers
      - python-tests
      - python-coverage
      - python-linter
      - live-tests
      - cpp-install-tests
      - build-sdist
      - build-wheel
    runs-on: ubuntu-slim
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35
        with:
          allowed-skips: >-
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-tests)
              && 'cpp-tests-ubuntu,cpp-tests-macos,cpp-tests-windows,cpp-sanitizers,cpp-install-tests,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-tests)
              && 'python-tests,python-coverage,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-linter)
              && 'python-linter,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-tests)
              && !fromJSON(needs.change-detection.outputs.run-cd)
              && 'build-sdist,build-wheel,' || ''
            }}
            ${{
              (
                github.event_name == 'pull_request'
                && github.event.pull_request.head.repo.full_name != github.repository
                || !fromJSON(needs.change-detection.outputs.run-cpp-tests)
                && !fromJSON(needs.change-detection.outputs.run-python-tests)
                && !fromJSON(needs.change-detection.outputs.run-cd)
              )
              && 'live-tests,' || ''
            }}
          jobs: ${{ toJSON(needs) }}
