name: 🐍 • Packaging

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner image to build and test on
        type: string
        required: true
    secrets:
      PASQAL_EMAIL:
        required: false
      PASQAL_PASSWORD:
        required: false
      PASQAL_PROJECT_ID:
        required: false

permissions:
  contents: read

jobs:
  build-wheel:
    name: 🎡 ${{ inputs.runs-on }}
    runs-on: ${{ inputs.runs-on }}
    # Four platform slots keep two-program batches below the EMU_FREE limit.
    concurrency:
      group: pasqal-emu-free-${{ inputs.runs-on }}
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: ${{ !startsWith(inputs.runs-on, 'ubuntu') }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3 # v4.3.4
        env:
          PASQAL_EMAIL: ${{ secrets.PASQAL_EMAIL }}
          PASQAL_PASSWORD: ${{ secrets.PASQAL_PASSWORD }}
          PASQAL_PROJECT_ID: ${{ secrets.PASQAL_PROJECT_ID }}
          # Forks cannot receive credentials; trusted runs execute every test.
          CIBW_TEST_COMMAND: >-
            pytest test/python
            ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.id != github.event.pull_request.base.repo.id && '-m "not integration"' || '' }}
      - name: Verify clean directory
        run: git diff --exit-code
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'pull_request' && 'dev-' || '' }}cibw-wheels-${{ inputs.runs-on }}
          path: wheelhouse/*.whl
