name: CD 🚀
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build-sdist:
    name: 🚀 CD
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-sdist.yml@a4b4977405c7685f95e127cdb6db396bbadce787 # v2.5.5
    permissions:
      contents: read

  build-wheel:
    name: 🚀 CD
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, windows-2025]
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-wheel-cibuildwheel.yml@a4b4977405c7685f95e127cdb6db396bbadce787 # v2.5.5
    with:
      runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read

  deploy:
    name: 🚀 Publish
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build-sdist, build-wheel]
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/p/pasqal-qdmi
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Generate artifact attestation for sdist and wheels
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
